<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>zdjęcia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<img id="cat" src="20250918_031845.jpg" alt="Kot">
<nav>
    <a href="index.html">Start</a>
    <a href="screeny.html">Screeny</a>
    <a href="formula.html">Formuła</a>
</nav>

<div class="container">
    <h1>Wspólne zdjęcia ( jak bede miał więcej screenów to dodam więcej ) </h1>

  <div class="slider-container">
    <span class="prev">&#10094;</span>
    <img id="sliderImage" src="1ss.png" alt="screen" />
     <div class="flash-line"></div>
    
    <span class="next">&#10095;</span>
</div>
</div>
<div class="animation-area"></div>
<script>
const images = [
    "1ss.png",
    "2ss.png",
    "3ss.png",
    "ss4.png",
    "ss5.png",
    "ss6.png",
    "ss7.png",
    "a.png",
    "b.png",
    "c.png",
    "nastepny.png",
];

let currentIndex = 0;
const sliderImage = document.getElementById("sliderImage");

function showImage(index) {
    if(index < 0) index = images.length - 1;
    if(index >= images.length) index = 0;
    currentIndex = index;
    sliderImage.src = images[currentIndex];
}

document.querySelector(".prev").addEventListener("click", () => {
    showImage(currentIndex - 1);
});

document.querySelector(".next").addEventListener("click", () => {
    showImage(currentIndex + 1);
});
</script>

<script> cat = document.getElementById('cat');

document.addEventListener('mousemove', (e) => {
    const mouseX = e.clientX;
    const mouseY = e.clientY;

    const catX = cat.offsetLeft + cat.width / 2;
    const catY = cat.offsetTop + cat.height / 2;

   
    const angle = Math.atan2(mouseY - catY, mouseX - catX);


    const speed = 5;
    const dx = Math.cos(angle) * speed;
    const dy = Math.sin(angle) * speed;

    cat.style.left = cat.offsetLeft + dx + 'px';
    cat.style.top = cat.offsetTop + dy + 'px';

   
    cat.style.transform = `rotate(${angle}rad)`;
});
</script>
<script>
const area = document.querySelector('.animation-area');

for(let i = 0; i < 40; i++) { 
    const spark = document.createElement('div');
    spark.classList.add('spark');

    // losowa pozycja startowa
    spark.style.left = Math.random() * window.innerWidth + 'px';
    spark.style.top = Math.random() * -400 + 'px'; 

    
    spark.style.animationDuration = 3 + Math.random() * 3 + 's';
    spark.style.animationDelay = Math.random() * 5 + 's';

    area.appendChild(spark);
}
</script>
<p>KOCHAM BLONDYNKI</p>
<footer>ZAJEBISTY JESTEŚ PAKO, NIE ZMIENIAJ SIE PROSZE CIE</footer>
</body>
</html>
