<script>
const modal = document.getElementById("videoModal");
const video = document.getElementById("videoPlayer");


document.getElementById("openVideo").addEventListener("click", () => {
    modal.style.display = "block";
    video.currentTime = 0; 
    video.play();
});


document.getElementById("closeModal").addEventListener("click", () => {
    modal.style.display = "none";
    video.pause();
});


window.onclick = function(e) {
    if (e.target === modal) {
        modal.style.display = "none";
        video.pause();
    }
}
</script>

 <p class="small-note">Nie znam sie na formule, ale wiem że ją bardzo lubisz więc sie starałem. ps. jak klikniesz na jedno zdjecie to powinno sie coś wyświelić.</p>

<script> cat = document.getElementById('cat');

document.addEventListener('mousemove', (e) => {
    const mouseX = e.clientX;
    const mouseY = e.clientY;

    const catX = cat.offsetLeft + cat.width / 2;
    const catY = cat.offsetTop + cat.height / 2;

   
    const angle = Math.atan2(mouseY - catY, mouseX - catX);


    const speed = 5;
    const dx = Math.cos(angle) * speed;
    const dy = Math.sin(angle) * speed;

    cat.style.left = cat.offsetLeft + dx + 'px';
    cat.style.top = cat.offsetTop + dy + 'px';

   
    cat.style.transform = `rotate(${angle}rad)`;
});
</script>
